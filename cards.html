<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Leo's Birthday Cards</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6efe3;color:#17233a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}h1{text-align:center;margin:8px 0 4px;font-size:clamp(2rem,6vw,4rem)}.sub{text-align:center;margin:0 0 20px;font-size:1.1rem}.nav{text-align:center;margin:0 0 22px}.nav a{display:inline-block;margin:5px;padding:11px 16px;border-radius:14px;background:#17375e;color:#fff;text-decoration:none;font-weight:800}.video{background:#b51f1f!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:white;border-radius:20px;padding:10px;box-shadow:0 7px 22px #0002;cursor:pointer}.card img{display:block;width:100%;height:auto;border-radius:14px}.hint{text-align:center;margin:18px 0;color:#555}.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:94vh;object-fit:contain}.close{position:fixed;right:18px;top:14px;border:0;border-radius:50%;width:46px;height:46px;font-size:26px;background:white;cursor:pointer}
</style></head><body><main class="wrap"><h1>🎨 Baby Leo’s Birthday Cards 🐾</h1><p class="sub">Made especially for Grandad Tony’s 57th Birthday ❤️</p><div class="nav"><a href="index.html">🎂 Birthday Quiz</a><a href="gallery.html">📸 Leo’s Photo Gallery</a><a class="video" href="https://youtu.be/K1EqEX5H6Go" target="_blank" rel="noopener">🎬 Watch Leo’s Birthday Video</a></div><div class="grid">
<div class="card"><img src="baby-leo-card-1.png" alt="Happy Birthday Tony from Baby Leo"></div>
<div class="card"><img src="baby-leo-card-2.png" alt="Baby Leo birthday collage for Tony"></div>
<div class="card"><img src="baby-leo-card-3.png" alt="Baby Leo Grandad's Best Boy birthday collage"></div>
<div class="card"><img src="baby-leo-card-4.png" alt="Tony and Baby Leo best friends collage"></div>
<div class="card"><img src="baby-leo-card-5.png" alt="Baby Leo Grandad's Best Boy collage"></div>
<div class="card"><img src="baby-leo-card-6.png" alt="Baby Leo sings Happy Birthday Tony"></div>
</div><p class="hint">Tap any picture to see it full-screen.</p></main><div id="lb" class="lightbox" aria-hidden="true"><button class="close" aria-label="Close">×</button><img id="big" alt=""></div><script>const lb=document.getElementById('lb'),big=document.getElementById('big');document.querySelectorAll('.card img').forEach(i=>i.onclick=()=>{big.src=i.src;big.alt=i.alt;lb.classList.add('open');lb.setAttribute('aria-hidden','false')});function close(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');big.src=''}document.querySelector('.close').onclick=close;lb.onclick=e=>{if(e.target===lb)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});</script></body></html>
